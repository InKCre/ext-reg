[project]
name = "inkcre-extension-registry"
version = "0.1.0"
description = "Public package registry and Runtime/API contracts for InKCre Extensions"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-only"
authors = [{ name = "InKCre" }]
dependencies = [
  "fastapi>=0.141,<0.142",
  "pydantic>=2.10.6,<2.11",
  "semantic-version>=2.10,<3",
]

[project.optional-dependencies]
cli = [
  "httpx>=0.28,<0.29",
  "typer>=0.21,<0.22",
]

[project.scripts]
inkcre-ext = "inkcre_extension_registry.cli:app"

[project.urls]
Repository = "https://github.com/InKCre/ext-reg"

[dependency-groups]
dev = [
  "build>=1.4,<2",
  "httpx>=0.28,<0.29",
  "pyright>=1.1.405,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<0.15",
  "typer>=0.21,<0.22",
  "workers-py>=1.16,<2",
  "workers-runtime-sdk>=1.6,<2",
]

[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkcre_extension_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false

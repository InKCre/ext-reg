[project]
name = "inkcre-extension-registry"
version = "0.2.0"
description = "Native Python and Module Federation distribution registry for InKCre Extensions"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-only"
authors = [{ name = "InKCre" }]
dependencies = [
  "fastapi>=0.139.2,<0.142",
  "inkcre-extension-toolkit>=0.2,<0.3",
  "packaging>=25,<27",
  "python-multipart>=0.0.22,<0.1",
]

[project.urls]
Repository = "https://github.com/InKCre/ext-reg"

[dependency-groups]
dev = [
  "build>=1.4,<2",
  "datamodel-code-generator>=0.35,<0.36",
  "httpx>=0.28,<0.29",
  # Keep the verified Cloudflare Worker dependency while the public wheel
  # metadata remains compatible with peer runtimes on newer Pydantic minors.
  "pydantic==2.10.6",
  "pyright>=1.1.405,<2",
  "ruff>=0.14,<0.15",
  "typer>=0.21,<0.22",
  "wheel>=0.46,<0.48",
  "workers-py>=1.16,<2",
  "workers-runtime-sdk>=1.6,<2",
]

[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkcre_extension_registry"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pdm.workspace]
members = ["toolkit", "runtimes/core-py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src", "toolkit/src", "runtimes/core-py/src"]
ignore = ["runtimes/core-py/src/inkcre_extension_runtime_core_py/generated"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[[tool.pyright.executionEnvironments]]
root = "runtimes/core-py"
extraPaths = ["runtimes/core-py/src"]
reportMissingImports = false

[[tool.pyright.executionEnvironments]]
root = "."

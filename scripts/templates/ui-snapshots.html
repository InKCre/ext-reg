<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Registry UI snapshots</title>
    <!-- prettier-ignore -->
    <style>{{ styles | safe }}</style>
    <style>
      .snapshot-navigation {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--sys-color-surface-base);
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        padding: 8px 16px;
        border-bottom: 1px dashed currentColor;
        font-size: 12px;
      }
      .snapshot {
        display: none;
      }
      .snapshot:target {
        display: block;
      }
      body:not(:has(.snapshot:target)) #sample-0 {
        display: block;
      }
    </style>
  </head>
  <body>
    <nav class="snapshot-navigation" aria-label="Page samples">
      <span>Static page samples · Controls are not interactive</span>
      {% for sample in samples %}
      <a href="#sample-{{ loop.index0 }}">{{ sample.label }}</a>
      {% endfor %}
    </nav>
    {% for sample in samples %}
    <section
      class="snapshot"
      id="sample-{{ loop.index0 }}"
      role="img"
      aria-label="{{ sample.label }} page sample"
    >
      <div inert>{{ sample.body | safe }}</div>
    </section>
    {% endfor %}
  </body>
</html>

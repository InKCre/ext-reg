<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="InKCre Extension Registry" />
    {% if preview or noindex %}
    <meta name="robots" content="noindex,nofollow" />
    {% endif %}
    <title>{{ title }} · InKCre Registry</title>
    <style>{{ styles | safe }}</style>
    {% if not preview %}
    <script src="/assets/registry.js" defer></script>
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a
        class="brand"
        href="{% if preview %}#catalog{% else %}/{% endif %}"
        aria-label="InKCre Registry home"
      >
        <span aria-hidden="true">{% include "brand.html" %}</span>
        <span>InKCre</span>
      </a>
      <nav aria-label="Main navigation">
        <a
          href="{% if preview %}#catalog{% else %}/{% endif %}"
          {% if active == 'catalog' %}
          aria-current="page"
          {% endif %}
        >
          Registry
        </a>
        {% if preview %}
        <span class="preview-label" title="Sample data; publishing requires the Registry service">
          Preview
        </span>
        {% else %}
        <a href="/publish" {% if active == 'publish' %} aria-current="page" {% endif %}>
          Publisher
        </a>
        <button class="theme-button icon-button" type="button" aria-label="Switch color theme">
          ◐
        </button>
        {% endif %}
      </nav>
    </header>
    <main id="main">{% block content %}{% endblock %}</main>
    <div id="announcement" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>

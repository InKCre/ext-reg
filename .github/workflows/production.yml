name: Deploy Extension Registry production

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact verified main SHA authorized for production delivery
        required: true
        type: string
      operation:
        description: Verify production authority without mutation, or deploy exact main
        required: true
        default: verify
        type: choice
        options:
          - verify
          - deploy

permissions:
  contents: read

concurrency:
  group: registry-production
  cancel-in-progress: false

jobs:
  deploy:
    name: ext-reg deployment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://registry.inkcre.dev
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry-check
          POSTGRES_DB: registry_check
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U registry -d registry_check"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      REGISTRY_TEST_DATABASE_URL: postgres://registry:registry-check@localhost:5432/registry_check
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Reject a moved main branch
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current_main" = "$SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install PDM
        run: python -m pip install pdm==2.28.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install frozen delivery dependencies
        run: |
          pdm install --frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Verify exact delivery source
        run: pnpm check

      - name: Build the same CPython service artifact used by previews
        run: docker build --build-arg SOURCE_REVISION="$SOURCE_SHA" --tag registry-production .

      - name: Install the pinned Heroku CLI
        if: inputs.operation == 'deploy'
        run: npm install --global heroku@11.8.1

      - name: Migrate and release the authorized production app
        if: inputs.operation == 'deploy'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current_main" = "$SOURCE_SHA"
          pdm run python scripts/registry_production.py --image registry-production

      - name: Record delivery boundary
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          {
            echo '## Registry CPython 交付'
            echo "- 来源：$SOURCE_SHA"
            echo "- 操作：$OPERATION"
            echo '- 数据导入、旧写入暂停和域名切换按 production-registry.md 单独执行。'
          } >> "$GITHUB_STEP_SUMMARY"

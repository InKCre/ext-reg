name: Native Registry cutover handoff (remote mutation disabled)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact verified main SHA authorized for native cutover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: registry-production
  cancel-in-progress: false

jobs:
  handoff:
    name: Verify exact main and record blocked delivery handoff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Reject a moved main branch
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current_main" = "$SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv==0.12.3

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install frozen delivery dependencies
        run: |
          uv sync --frozen
          pnpm install --frozen-lockfile

      - name: Verify exact delivery source
        run: pnpm check

      - name: Record non-mutating cutover handoff
        run: |
          {
            echo '## Extension Registry cutover handoff'
            echo
            echo "- Source: \`$SOURCE_SHA\`"
            echo '- Full repository contract: passed in this run'
            echo '- Remote mutation: disabled'
            echo '- Blocker: current Wrangler bindings identify the pre-cutover resources'
            echo '- Next authority boundary: provision new D1/R2 and freeze exact bindings during the delivery handshake'
          } >> "$GITHUB_STEP_SUMMARY"

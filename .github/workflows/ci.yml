name: Registry checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject new high-severity vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: development, runtime

  repository:
    name: ext-reg checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv==0.12.3

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install frozen dependencies
        run: |
          uv sync --frozen
          pnpm install --frozen-lockfile

      - name: Run repository contract
        run: pnpm check

      - name: Initialize isolated local Registry
        run: |
          pnpm exec wrangler d1 migrations apply DB --local --config wrangler.jsonc
          pnpm exec wrangler d1 execute DB --local --config wrangler.jsonc \
            --file tests/fixtures/local-seed.sql

      - name: Prove native Python and MF publication on the real Worker
        run: |
          uv run pywrangler dev --port 8791 \
            --var PUBLIC_ORIGIN:http://127.0.0.1:8791 \
            > /tmp/inkcre-registry-worker.log 2>&1 &
          worker_pid=$!
          trap 'cat /tmp/inkcre-registry-worker.log; kill "$worker_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8791/livez > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8791/livez > /dev/null
          uv run python scripts/worker_smoke.py \
            --registry-url http://127.0.0.1:8791 \
            --token inkcre-local-publisher-token

      - name: Upload exact Registry package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-packages-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error
          retention-days: 7

  ui-preview-artifact:
    name: Build exact UI preview artifact
    if: github.event_name == 'pull_request'
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv==0.12.3

      - name: Install frozen Python dependencies
        run: uv sync --frozen

      - name: Build the static Extension-list preview
        run: >-
          uv run python scripts/build_ui_preview.py
          --fixture tests/fixtures/ui-preview.json
          --output .ui-preview
          --api-origin https://registry.inkcre.dev

      - name: Verify the bounded handoff artifact
        run: |
          test "$(find .ui-preview -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 1
          test -f .ui-preview/index.html
          test ! -L .ui-preview/index.html
          test ! -x .ui-preview/index.html
          test "$(wc -c < .ui-preview/index.html | tr -d ' ')" -le 65536

      - name: Upload the exact-head preview document
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ext-reg-ui-preview-${{ github.event.pull_request.head.sha }}
          path: .ui-preview/index.html
          if-no-files-found: error
          retention-days: 1

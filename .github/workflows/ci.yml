name: Registry checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject new high-severity vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: development, runtime

  repository:
    name: Repository and Worker contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv==0.12.3

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install frozen dependencies
        run: |
          uv sync --frozen
          pnpm install --frozen-lockfile

      - name: Run repository contract
        run: pnpm check

      - name: Prove Python 3.12 Runtime/API compatibility
        run: |
          uv python install 3.12
          uv venv --python 3.12 /tmp/inkcre-extension-runtime-python312
          runtime_wheel="$(find dist -maxdepth 1 -name 'inkcre_extension_registry-*.whl' -print -quit)"
          uv pip install \
            --python /tmp/inkcre-extension-runtime-python312/bin/python \
            "${runtime_wheel}[client]"
          /tmp/inkcre-extension-runtime-python312/bin/python -c \
            'from inkcre_extension_registry import PlatformProfile, __version__; from inkcre_extension_registry.client import RegistryClient; assert __version__ == "0.1.1"; PlatformProfile(capabilities={}); RegistryClient("https://registry.example")'

      - name: Initialize isolated local Registry
        run: |
          pnpm exec wrangler d1 migrations apply DB --local --config wrangler.jsonc
          pnpm exec wrangler d1 execute DB --local --config wrangler.jsonc \
            --file tests/fixtures/local-seed.sql

      - name: Prove the real Worker publish and public read path
        run: |
          uv run pywrangler dev --port 8791 > /tmp/inkcre-registry-worker.log 2>&1 &
          worker_pid=$!
          trap 'cat /tmp/inkcre-registry-worker.log; kill "$worker_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8791/livez > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8791/livez > /dev/null
          uv run python scripts/worker_smoke.py \
            --registry-url http://127.0.0.1:8791 \
            --token inkcre-local-publisher-token

      - name: Pack the exact Web Runtime/API
        run: pnpm --filter @inkcre/extension-runtime pack --pack-destination ../../dist

      - name: Upload exact package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-packages-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.tgz
            dist/*.whl
          if-no-files-found: error
          retention-days: 7

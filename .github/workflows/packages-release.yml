name: Release Extension packages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: extension-package-release-main
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Web Runtime release plan
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      has_changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install the frozen JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Create or update the package Version PR
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm release:version
          pr-title: 'chore(release): version Extension packages'
          commit-message: 'chore(release): version Extension packages'
          pr-base-branch: main
          create-github-releases: false
          push-git-tags: false

  publish:
    name: Publish Extension package releases
    needs: reconcile
    if: needs.reconcile.outputs.has_changesets == 'false'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    steps:
      - name: Checkout the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the release revision is current main
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current_main" = "$GITHUB_SHA"

      - name: Set up Python and PDM
        uses: pdm-project/setup-pdm@973541a5febeafcfdadf8a51211435be6ecfd90f # v4.5
        with:
          python-version-file: .python-version
          version: 2.28.0
          cache: true

      - name: Set up exact Changie release tool
        uses: miniscruff/changie-action@3223cb29b92a0972dedc864ace3da01e04780ae4 # v3.0.1
        with:
          version: v1.25.2

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install frozen dependencies
        run: |
          pdm install --frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Run repository contract
        run: pnpm check

      - name: Verify managed package versions
        run: |
          toolkit_version=$(python -c 'import tomllib; print(tomllib.load(open("toolkit/pyproject.toml", "rb"))["project"]["version"])')
          core_runtime_version=$(python -c 'import tomllib; print(tomllib.load(open("runtimes/core-py/pyproject.toml", "rb"))["project"]["version"])')
          test "$(changie latest --project toolkit)" = "toolkit-$toolkit_version"
          test "$(changie latest --project runtime-core-py)" = "runtime-core-py-$core_runtime_version"
          test -f runtimes/client-web/CHANGELOG.md

      - name: Build independent package assets
        run: |
          mkdir -p release-assets/toolkit release-assets/runtime-core-py release-assets/runtime-client-web
          pdm build --project toolkit --dest release-assets/toolkit
          pdm build --project runtimes/core-py --dest release-assets/runtime-core-py
          pnpm --filter @inkcre/extension-runtime-client-web build
          pnpm --filter @inkcre/extension-runtime-client-web pack \
            --pack-destination "$GITHUB_WORKSPACE/release-assets/runtime-client-web"

      - name: Create missing independent package releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_package() {
            package=$1
            version=$2
            assets=$3
            tag="$package-v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already exists." >> "$GITHUB_STEP_SUMMARY"
              return
            fi
            gh release create "$tag" "$assets"/* \
              --target "$GITHUB_SHA" \
              --title "$package v$version" \
              --generate-notes
            echo "$tag published from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          }

          release_package toolkit \
            "$(python -c 'import tomllib; print(tomllib.load(open("toolkit/pyproject.toml", "rb"))["project"]["version"])')" \
            release-assets/toolkit
          release_package runtime-core-py \
            "$(python -c 'import tomllib; print(tomllib.load(open("runtimes/core-py/pyproject.toml", "rb"))["project"]["version"])')" \
            release-assets/runtime-core-py
          release_package runtime-client-web \
            "$(node -p 'require("./runtimes/client-web/package.json").version')" \
            release-assets/runtime-client-web

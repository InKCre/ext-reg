name: Release Extension packages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: extension-package-release-main
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Web Runtime release plan
    permissions:
      actions: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install the frozen JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Create or update the package Version PR
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm release:version
          pr-title: 'chore(release): version Extension packages'
          commit-message: 'chore(release): version Extension packages'
          pr-base-branch: main
          create-github-releases: false
          push-git-tags: false

      - name: Run required checks for the generated Version PR
        if: steps.changesets.outputs['has-changesets'] == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch=$(gh pr view "${{ steps.changesets.outputs['pr-number'] }}" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --ref "$branch" -f base_revision="$GITHUB_SHA"

  reconcile-python:
    name: Reconcile Python release plan
    permissions:
      actions: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python and PDM
        uses: pdm-project/setup-pdm@973541a5febeafcfdadf8a51211435be6ecfd90f # v4.5
        with:
          python-version-file: .python-version
          version: 2.28.0
          cache: true

      - name: Install locked release tooling
        run: pdm install -G dev --frozen-lockfile

      - name: Prepare pending Python packages
        run: pdm run release:prepare

      - name: Update the protected Version PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release_pr.sh

  publish:
    name: Publish Extension package releases
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    steps:
      - name: Checkout the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the release revision is current main
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current_main" = "$GITHUB_SHA"

      - name: Set up Python and PDM
        uses: pdm-project/setup-pdm@973541a5febeafcfdadf8a51211435be6ecfd90f # v4.5
        with:
          python-version-file: .python-version
          version: 2.28.0
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install frozen dependencies
        run: |
          pdm install --frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Check package contracts before building release assets
        run: pnpm contracts:check && pnpm format:check && pnpm lint && pnpm type-check

      - name: Verify managed package versions
        run: |
          web_runtime_version=$(node -p 'require("./runtimes/client-web/package.json").version')
          pdm run check:releases
          grep -F -m1 "## $web_runtime_version" runtimes/client-web/CHANGELOG.md

      - name: Build independent package assets
        env:
          SOURCE_DATE_EPOCH: '315532800'
        run: |
          mkdir -p release-assets/toolkit release-assets/runtime-core-py release-assets/runtime-client-web
          pdm build --project toolkit --dest "$GITHUB_WORKSPACE/release-assets/toolkit"
          pdm build --project runtimes/core-py --dest "$GITHUB_WORKSPACE/release-assets/runtime-core-py"
          pnpm --filter @inkcre/extension-runtime-client-web build
          pnpm --filter @inkcre/extension-runtime-client-web pack \
            --pack-destination "$GITHUB_WORKSPACE/release-assets/runtime-client-web"

      - name: Create missing independent package releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_package() {
            package=$1
            version=$2
            assets=$3
            tag="$package-v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              test "$(gh release view "$tag" --json assets --jq '.assets | length')" -gt 0
              echo "$tag already exists with package assets." >> "$GITHUB_STEP_SUMMARY"
              return
            fi
            gh release create "$tag" "$assets"/* \
              --target "$GITHUB_SHA" \
              --title "$package v$version" \
              --generate-notes
            echo "$tag published from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          }

          if ! find toolkit/.changes -type f ! -name .gitkeep | grep -q .; then
            release_package toolkit \
              "$(python -c 'import tomllib; print(tomllib.load(open("toolkit/pyproject.toml", "rb"))["project"]["version"])')" \
              release-assets/toolkit
          else
            echo "Toolkit has pending release fragments; publication waits for its Version PR." >> "$GITHUB_STEP_SUMMARY"
          fi
          if ! find runtimes/core-py/.changes -type f ! -name .gitkeep | grep -q .; then
            release_package runtime-core-py \
              "$(python -c 'import tomllib; print(tomllib.load(open("runtimes/core-py/pyproject.toml", "rb"))["project"]["version"])')" \
              release-assets/runtime-core-py
          else
            echo "Core Python Runtime has pending release fragments; publication waits for its Version PR." >> "$GITHUB_STEP_SUMMARY"
          fi
          release_package runtime-client-web \
            "$(node -p 'require("./runtimes/client-web/package.json").version')" \
            release-assets/runtime-client-web
